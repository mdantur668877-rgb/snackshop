<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D62828"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>ANTUR FOODS</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC93C;--r:#D62828;--ink:#1B1F3B;--bg:#FAFAF7;--card:#fff;--mut:#6b7086;--ln:#e6e6df;--ok:#2b9348}
@media(prefers-color-scheme:dark){:root{--bg:#14162b;--card:#1f2340;--ink:#f3f3f8;--mut:#a3a8c4;--ln:#323761}}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--ink);font:16px/1.45 'Hind Siliguri',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{background:var(--r);color:#fff;padding:14px 16px;font-weight:700;font-size:20px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.5px}
main{padding:14px;max-width:640px;margin:auto}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);margin:4px 0 10px}
button{border:0;border-radius:10px;padding:11px 16px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
button.p{background:var(--r);color:#fff}button.y{background:var(--y);color:#1B1F3B}button.g{background:transparent;color:var(--r);border:1.5px solid var(--r)}
button.b{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.chips button{white-space:nowrap;background:var(--card);color:var(--ink);border:1.5px solid var(--ln)}.chips .on{background:var(--y);color:#1B1F3B;border-color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--ln);display:flex;flex-direction:column;position:relative}
.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--y);display:block}
.pc>div:last-child{padding:10px}.pc b{display:block}.old{text-decoration:line-through;color:var(--mut);font-size:14px;margin-left:6px}
.tag{position:absolute;top:8px;left:8px;background:var(--r);color:#fff;padding:2px 8px;border-radius:20px;font-size:13px;font-weight:700}
.out{opacity:.5}
.row{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qty{display:flex;align-items:center;gap:10px}.qty button{padding:4px 12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px 4px}nav .on{color:var(--r);box-shadow:inset 0 3px 0 var(--r)}
.st{padding:2px 10px;border-radius:20px;font-size:14px;font-weight:700;background:var(--y);color:#1B1F3B}
.st.Confirmed{background:#a5d8ff}.st.Delivered{background:#b2f2bb}.st.Cancelled{background:#ffc9c9}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;background:var(--ink);color:var(--bg);padding:14px;border-radius:12px;z-index:9;text-align:center;font-weight:700}
.modal{position:fixed;inset:0;background:#000a;z-index:8;overflow:auto;padding:14px}.modal>div{background:var(--bg);border-radius:14px;padding:16px;max-width:520px;margin:auto}
h2{margin:6px 0 12px}.mut{color:var(--mut);font-size:14px}.empty{text-align:center;color:var(--mut);padding:40px 0}
.sm{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.free{display:inline-block;background:#2b934822;color:var(--ok);border-radius:20px;padding:1px 9px;font-size:13px;font-weight:700;margin-top:4px}
.good{color:var(--ok);font-weight:700}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--y) center/cover;flex:none;display:block}
.av.big{width:88px;height:88px}
.ph0{display:flex;align-items:center;justify-content:center;font-size:20px;background-color:#ffe08a}.av.big.ph0{font-size:34px}
.cc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.lb{display:block;text-align:center;border:1.5px solid var(--r);color:var(--r);border-radius:10px;padding:11px;font-weight:700;cursor:pointer;margin:10px 0}
.who{display:flex;align-items:center;gap:10px}
label.f{display:block;color:var(--mut);font-size:14px;margin-top:2px}
/* ---- স্প্ল্যাশ অ্যানিমেশন ---- */
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#FFC93C 0%,#ffb703 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:spOut .6s ease 2.2s forwards}
#splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 34px #0003;opacity:0;transform:scale(.5) rotate(-8deg);animation:spPop .8s cubic-bezier(.2,.9,.3,1.25) .15s forwards,spFloat 2.2s ease-in-out .95s infinite}
#splash .nm{font-size:32px;font-weight:700;color:#D62828;letter-spacing:3px;display:flex;white-space:pre}
#splash .nm span{display:inline-block;opacity:0;transform:translateY(16px) scale(.8);animation:spUp .5s cubic-bezier(.2,.9,.3,1.2) calc(.6s + var(--i)*.07s) forwards}
#splash i{display:block;width:56px;height:4px;border-radius:4px;background:#D62828;opacity:0;animation:spBar 1.1s ease 1s forwards;transform-origin:center}
@keyframes spPop{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spFloat{50%{transform:translateY(-6px)}}
@keyframes spBar{0%{opacity:.9;transform:scaleX(0)}100%{opacity:.9;transform:scaleX(1)}}
@keyframes spOut{to{opacity:0;visibility:hidden;transform:scale(1.04)}}
#app{animation:appIn .7s ease 2.2s both}
@keyframes appIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#splash,#splash *,#app{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body><div id="splash"><img src="icon.svg" alt=""><div class="nm" aria-label="ANTUR FOODS"><span style="--i:0">A</span><span style="--i:1">N</span><span style="--i:2">T</span><span style="--i:3">U</span><span style="--i:4">R</span><span style="--i:5"> </span><span style="--i:6">F</span><span style="--i:7">O</span><span style="--i:8">O</span><span style="--i:9">D</span><span style="--i:10">S</span></div><i></i></div><div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== এখানে আপনার Firebase কনফিগ বসান ======
const firebaseConfig={apiKey:"AIzaSyAo2-bJDFoeLF7sJ_bj3LKpzxe5Ek0ZW7Q",authDomain:"shop-6e404.firebaseapp.com",projectId:"shop-6e404",appId:"1:78168047358:web:504de549a52f0e04562faf"};
// ===============================================
const NAME='ANTUR FOODS';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),T=n=>'৳'+(Math.round(n*100)/100),fp=p=>Math.round(p.price*(100-(p.discount||0))/100);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={cart:{},tab:'shop',cat:'সব',q:'',products:[],orders:[],mode:'in',unsub:[],img:'',av:'',simg:'',users:{},costs:{},shop:{}};
const CATS=['চিপস','কোল্ড ড্রিংকস','অন্যান্য'];
const ST=['Pending','Confirmed','Delivered','Cancelled'],STB={Pending:'অপেক্ষমাণ',Confirmed:'কনফার্ম',Delivered:'ডেলিভারি হয়েছে',Cancelled:'বাতিল'};
const ms=o=>o.createdAt?.toMillis?.()||Date.now(),dt=o=>new Date(ms(o)).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},400)}catch(e){}}
const isAdmin=()=>S.profile?.role==='admin';
const okImg=s=>typeof s==='string'&&s.startsWith('data:image/');
const av=(src,c='',id='')=>okImg(src)?`<img ${id?`id="${id}" `:''}class="av ${c}" src="${esc(src)}" alt="">`:`<div ${id?`id="${id}" `:''}class="av ${c} ph0">👤</div>`;
const permErr=e=>e.code==='permission-denied'?'অনুমতি নেই — Firebase Rules আপডেট করুন':e.message;
function shrink(f,m,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7));URL.revokeObjectURL(im.src)};im.onerror=()=>toast('ছবিটা পড়া যায়নি');im.src=URL.createObjectURL(f)}

onAuthStateChanged(auth,async u=>{
  if(S.signing)return;S.user=u;S.unsub.forEach(f=>f());S.unsub=[];
  if(u){const d=await getDoc(doc(db,'users',u.uid));S.profile=d.exists()?d.data():{name:u.email,role:'user'};S.tab=isAdmin()?'orders':'shop';start()}
  render()});
function start(){
  const er=()=>{if(isAdmin()&&!S.re){S.re=1;toast('⚠️ Firebase Rules আপডেট করা হয়নি')}};
  S.unsub.push(onSnapshot(collection(db,'products'),s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));renderList()}));
  S.unsub.push(onSnapshot(doc(db,'settings','shop'),d=>{S.shop=d.exists()?d.data():{};renderList()},er));
  if(isAdmin()){
    S.unsub.push(onSnapshot(collection(db,'costs'),s=>{S.costs={};s.docs.forEach(d=>S.costs[d.id]=d.data().buy);renderList()},er));
    S.unsub.push(onSnapshot(collection(db,'users'),s=>{S.users={};s.docs.forEach(d=>S.users[d.id]=d.data());renderList()},er));
  }
  let first=true;
  const q=isAdmin()?query(collection(db,'orders'),orderBy('createdAt','desc')):query(collection(db,'orders'),where('uid','==',S.user.uid));
  S.unsub.push(onSnapshot(q,s=>{
    if(isAdmin()&&!first)s.docChanges().forEach(c=>{if(c.type==='added'){beep();toast('🔔 নতুন অর্ডার: '+c.doc.data().name)}});
    if(!isAdmin()&&!first)s.docChanges().forEach(c=>{if(c.type==='modified')toast('আপনার অর্ডার: '+STB[c.doc.data().status])});
    first=false;S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b)-ms(a));renderList()}));
}
function render(){
  const a=$('#app');
  if(!S.user)return a.innerHTML=`<header>${NAME}</header><main><h2>${S.mode==='in'?'লগইন':'নতুন অ্যাকাউন্ট'}</h2>
  ${S.mode==='up'?`<label style="display:block;text-align:center;margin-bottom:12px;cursor:pointer"><div id="avp" class="av big ph0" style="margin:0 auto 4px;${S.av?`background-image:url(${S.av})`:''}">${S.av?'':'📷'}</div><span class="mut">আপনার ছবি দিন (ঐচ্ছিক)</span><input type="file" accept="image/*" hidden onchange="pickAv(this)"></label><input id="n" placeholder="পুরো নাম"><input id="ph" type="tel" placeholder="ফোন নম্বর"><textarea id="ad" rows="2" placeholder="ডেলিভারি ঠিকানা"></textarea>`:''}
  <input id="em" type="email" placeholder="ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
  <button class="p b" onclick="auth_()">${S.mode==='in'?'লগইন করুন':'অ্যাকাউন্ট খুলুন'}</button><p class="empty"><a href="#" onclick="S.mode=S.mode==='in'?'up':'in';render();return false" style="color:var(--r)">${S.mode==='in'?'অ্যাকাউন্ট নেই? সাইন-আপ করুন':'আগেই অ্যাকাউন্ট আছে? লগইন করুন'}</a></p></main>`;
  const tabs=isAdmin()?[['orders','অর্ডার'],['prods','প্রোডাক্ট'],['rep','রিপোর্ট'],['me','প্রোফাইল']]:[['shop','দোকান'],['cart','কার্ট'+(cartN()?` (${cartN()})`:'')],['my','অর্ডার'],['me','প্রোফাইল']];
  a.innerHTML=`<header>${NAME}${isAdmin()?' · অ্যাডমিন':''}</header><main id="list"></main><nav>${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</nav>`;
  renderList()}
const cartN=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const cartItems=()=>Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id===id),q})).filter(x=>x.p);
const total=()=>cartItems().reduce((a,x)=>a+fp(x.p)*x.q,0);
const contact=()=>S.shop.phone||okImg(S.shop.photo)?`<div class="cc">${av(S.shop.photo,'big')}<div><b>${NAME}</b><span class="sm">${esc(S.shop.adminName||'দোকানদার')}</span>${S.shop.phone?`<a href="tel:${esc(S.shop.phone)}" style="color:var(--r);font-weight:700">📞 ${esc(S.shop.phone)}</a>`:''}</div></div>`:'';
function pcard(p){const cost=S.costs[p.id],pp=fp(p);
  return `<div class="pc ${p.inStock===false?'out':''}">${p.discount?`<span class="tag">-${p.discount}%</span>`:''}${p.img?`<img src="${esc(p.img)}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(p.name)}</b><span style="color:var(--r);font-weight:700">${T(pp)}</span>${p.discount?`<span class="old">${T(p.price)}</span>`:''}
${p.perCarton?`<span class="sm">১ কার্টনে ${p.perCarton} পিস · কার্টন ${T(pp*p.perCarton)}</span>`:''}${p.free?`<span class="free">🎁 ${esc(p.free)}</span>`:''}
${isAdmin()?`<span class="sm">ক্রয় ${cost!=null?T(cost)+' · <span class="good">লাভ '+T(pp-cost)+'/পিস</span>':'দেওয়া নেই'}</span><div class="between" style="padding:8px 0 0"><button onclick="editP('${p.id}')">এডিট</button><button class="g" onclick="stock('${p.id}',${p.inStock===false})">${p.inStock===false?'আছে করুন':'শেষ'}</button></div>`:
p.inStock===false?'<p class="mut">স্টক শেষ</p>':`<button class="y b" style="margin-top:8px" onclick="add('${p.id}')">কার্টে দিন</button>`}</div></div>`}
function renderList(){
  const el=$('#list');if(!el||!S.user)return;const t=S.tab;let h='';
  if(t==='me'&&el.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;
  if(t==='shop'||t==='prods'){
    h=(t==='shop'?contact():'')+(t==='prods'?`<button class="p b" onclick="editP()" style="margin-bottom:12px">+ নতুন প্রোডাক্ট</button>`:'')+
    `<input placeholder="প্রোডাক্ট খুঁজুন" value="${esc(S.q)}" oninput="S.q=this.value;renderGrid()"><div class="chips">${['সব',...CATS].map(c=>`<button class="${S.cat===c?'on':''}" onclick="S.cat='${c}';renderList()">${c}</button>`).join('')}</div><div id="grid" class="grid"></div>`;el.innerHTML=h;return renderGrid()}
  if(t==='cart'){const it=cartItems();h=it.length?it.map(x=>`<div class="row between"><div><b>${esc(x.p.name)}</b><br><span class="mut">${T(fp(x.p))} × ${x.q}</span></div><div class="qty"><button onclick="chg('${x.p.id}',-1)">−</button>${x.q}<button onclick="chg('${x.p.id}',1)">+</button></div></div>`).join('')+
    `<h2>মোট: ${T(total())}</h2><label class="mut">ডেলিভারি ঠিকানা</label><textarea id="oad" rows="2">${esc(S.profile.address||'')}</textarea><label class="mut">নোট (ঐচ্ছিক)</label><input id="note" placeholder="যেমন: ঠান্ডা ড্রিংকস দিন"><p class="mut" style="margin-bottom:10px">পেমেন্ট: ক্যাশ অন ডেলিভারি</p><button class="p b" onclick="order()">অর্ডার করুন</button>`:'<p class="empty">কার্ট খালি। দোকান থেকে প্রোডাক্ট যোগ করুন।</p>'}
  if(t==='my'||t==='orders'){h=(t==='orders'?`<h2>অর্ডার (${S.orders.length})</h2>`:'')+(S.orders.length?S.orders.map(o=>`<div class="row"><div class="between">${isAdmin()?`<span class="who">${av(S.users[o.uid]?.photo)}<b>${esc(o.name)}</b></span>`:`<b>${T(o.total)}</b>`}<span class="st ${o.status}">${STB[o.status]}</span></div>
    <div class="mut">${dt(o)}</div>${isAdmin()?`<div>📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>📍 ${esc(o.address)}</div>`:''}
    <ul style="margin:8px 0 8px 18px">${o.items.map(i=>`<li>${esc(i.name)} × ${i.qty} = ${T(i.price*i.qty)}</li>`).join('')}</ul>${o.note?`<div>📝 ${esc(o.note)}</div>`:''}<b>মোট: ${T(o.total)}</b>
    ${isAdmin()?`<select onchange="setSt('${o.id}',this.value)" style="margin-top:8px">${ST.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${STB[s]}</option>`).join('')}</select>`:''}</div>`).join(''):'<p class="empty">এখনো কোনো অর্ডার নেই।</p>')}
  if(t==='rep'){const ok=S.orders.filter(o=>o.status!=='Cancelled'),now=new Date(),day=ok.filter(o=>new Date(ms(o)).toDateString()===now.toDateString()),mon=ok.filter(o=>{const d=new Date(ms(o));return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
    const sum=a=>a.reduce((x,o)=>x+o.total,0),cnt={};mon.forEach(o=>o.items.forEach(i=>cnt[i.name]=(cnt[i.name]||0)+i.qty));
    const prof=a=>{let p=0,miss=0;a.forEach(o=>o.items.forEach(i=>{const c=S.costs[i.id];if(c==null)miss++;else p+=(i.price-c)*i.qty}));return{p,miss}},pd=prof(day),pm=prof(mon);
    const blk=(l,a,pr)=>`<div class="row"><div class="between"><span>${l} (${a.length}টি অর্ডার)</span><b>${T(sum(a))}</b></div><div class="between"><span class="mut">লাভ (বিক্রি − ক্রয়)</span><b class="good">${T(pr.p)}</b></div></div>`;
    h=`<h2>বিক্রির রিপোর্ট</h2><p class="mut" style="margin-bottom:10px">বাতিল অর্ডার হিসাবে ধরা হয়নি। লাভ হিসাবে এখনকার ক্রয়মূল্য ধরা হয়।</p>${blk('আজ',day,pd)}${blk('এই মাস',mon,pm)}${pd.miss+pm.miss?`<p class="mut" style="margin-bottom:10px">⚠️ যে পণ্যের ক্রয়মূল্য দেওয়া নেই, তার লাভ হিসাবে ধরা হয়নি।</p>`:''}<h2>এই মাসে বেশি বিক্রি</h2>`+
    (Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,c])=>`<div class="row between"><span>${esc(n)}</span><b>${c}টি</b></div>`).join('')||'<p class="empty">এখনো তথ্য নেই।</p>')}
  if(t==='me'){h=`<div style="text-align:center;display:flex;flex-direction:column;align-items:center">${av(S.profile.photo,'big')}<h2 style="margin-top:10px">${esc(S.profile.name)}</h2></div><p class="mut" style="text-align:center">${esc(S.user.email)}<br>${esc(S.profile.phone||'')}<br>${esc(S.profile.address||'')}</p>
    <label class="lb">ছবি বদলান<input type="file" accept="image/*" hidden onchange="myPhoto(this)"></label>`+
    (isAdmin()?`<div class="row" style="margin-top:16px"><b>গ্রাহকদের যা দেখানো হবে</b><p class="mut" style="margin-bottom:10px">আপনার ছবি ও ফোন নম্বর গ্রাহকের দোকান পেজে দেখা যাবে।</p>
      <div style="display:flex;justify-content:center">${av(S.simg||S.shop.photo,'big','shp')}</div>
      <label class="lb">দোকানের ছবি বাছুন<input type="file" accept="image/*" hidden onchange="pickShop(this)"></label>
      <label class="f">ফোন নম্বর</label><input id="sph" type="tel" placeholder="যেমন: 017XXXXXXXX" value="${esc(S.shop.phone||S.profile.phone||'')}">
      <button class="p b" onclick="saveShop()">সেভ করুন</button></div>`:'')+
    `<button class="g b" style="margin-top:12px" onclick="signOut_()">লগআউট</button>`}
  el.innerHTML=h}
function renderGrid(){const g=$('#grid');if(!g)return;const l=S.products.filter(p=>(S.cat==='সব'||p.cat===S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase()));g.innerHTML=l.map(pcard).join('')||'<p class="empty" style="grid-column:1/3">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>'}
// ---- actions ----
const W=(n,f)=>window[n]=f;W('S',S);W('render',render);
W('auth_',async()=>{const e=$('#em').value.trim(),p=$('#pw').value;
  try{if(S.mode==='in')await signInWithEmailAndPassword(auth,e,p);else{const n=$('#n').value.trim(),ph=$('#ph').value.trim(),ad=$('#ad').value.trim();if(!n||!ph||!ad)return toast('সব তথ্য দিন');
    S.signing=1;const c=await createUserWithEmailAndPassword(auth,e,p);const pr={name:n,phone:ph,address:ad,email:e,role:'user',photo:S.av||'',createdAt:serverTimestamp()};await setDoc(doc(db,'users',c.user.uid),pr);S.signing=0;S.av='';S.user=c.user;S.profile=pr;S.tab='shop';start();render()}}
  catch(x){S.signing=0;toast(x.code==='auth/invalid-credential'?'ইমেইল বা পাসওয়ার্ড ভুল':x.code==='auth/email-already-in-use'?'এই ইমেইলে অ্যাকাউন্ট আছে':x.message)}});
W('signOut_',()=>signOut(auth));
W('pickAv',inp=>{const f=inp.files[0];if(!f)return;shrink(f,200,d=>{S.av=d;const e=$('#avp');if(e){e.style.backgroundImage=`url(${d})`;e.textContent=''}})});
W('myPhoto',inp=>{const f=inp.files[0];if(!f)return;shrink(f,200,async d=>{try{await updateDoc(doc(db,'users',S.user.uid),{photo:d});S.profile.photo=d;renderList();toast('ছবি বদলেছে ✅')}catch(e){toast(permErr(e))}})});
W('pickShop',inp=>{const f=inp.files[0];if(!f)return;shrink(f,200,d=>{S.simg=d;const e=$('#shp');if(e)e.outerHTML=av(d,'big','shp')})});
W('saveShop',async()=>{try{await setDoc(doc(db,'settings','shop'),{photo:S.simg||S.shop.photo||'',phone:$('#sph').value.trim(),adminName:S.profile.name},{merge:true});S.simg='';toast('সেভ হয়েছে ✅')}catch(e){toast(permErr(e))}});
W('add',id=>{S.cart[id]=(S.cart[id]||0)+1;toast('কার্টে যোগ হয়েছে');render()});
W('chg',(id,d)=>{S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];render()});
W('order',async()=>{const it=cartItems();if(!it.length)return;const ad=$('#oad').value.trim();if(!ad)return toast('ঠিকানা দিন');
  try{await addDoc(collection(db,'orders'),{uid:S.user.uid,name:S.profile.name,phone:S.profile.phone,address:ad,note:$('#note').value.trim(),items:it.map(x=>({id:x.p.id,name:x.p.name,price:fp(x.p),qty:x.q})),total:total(),status:'Pending',payment:'COD',createdAt:serverTimestamp()});
  S.cart={};S.tab='my';render();toast('অর্ডার হয়েছে ✅')}catch(e){toast(e.message)}});
W('setSt',(id,s)=>updateDoc(doc(db,'orders',id),{status:s}));
W('stock',(id,v)=>updateDoc(doc(db,'products',id),{inStock:v}));
W('sumP',()=>{const pc=Math.floor(+$('#pcn').value||0),b=+$('#pb').value||0,s=+$('#pp').value||0,d=+$('#pd').value||0,f=Math.round(s*(100-d)/100),e=$('#sum');if(!e)return;
  e.textContent=s?`প্রতি পিসে লাভ: ${T(f-b)}`+(pc?` · ১ কার্টনে: ক্রয় ${T(b*pc)}, বিক্রয় ${T(f*pc)}, লাভ ${T((f-b)*pc)}`:''):''});
W('editP',id=>{const p=S.products.find(x=>x.id===id)||{},b=S.costs[id];S.img=p.img||'';const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h2>${id?'প্রোডাক্ট এডিট':'নতুন প্রোডাক্ট'}</h2>
  <label class="f">নাম</label><input id="pn" placeholder="যেমন: বিস্কুট" value="${esc(p.name||'')}">
  <label class="f">১ কার্টনে কত পিস</label><input id="pcn" type="number" inputmode="numeric" placeholder="যেমন: 24" value="${p.perCarton||''}" oninput="sumP()">
  <label class="f">ক্রয়মূল্য (প্রতি পিস, ৳) — শুধু আপনি দেখবেন</label><input id="pb" type="number" inputmode="decimal" placeholder="দোকানদার কত দামে কিনেছে" value="${b??''}" oninput="sumP()">
  <label class="f">বিক্রয়মূল্য (প্রতি পিস, ৳)</label><input id="pp" type="number" inputmode="decimal" placeholder="গ্রাহক কত দামে কিনবে" value="${p.price||''}" oninput="sumP()">
  <label class="f">ডিসকাউন্ট % (না থাকলে ০)</label><input id="pd" type="number" inputmode="numeric" placeholder="0" value="${p.discount||''}" oninput="sumP()">
  <p id="sum" class="good" style="margin:-4px 0 10px;font-size:14px"></p>
  <label class="f">ফ্রি অফার (না থাকলে খালি রাখুন)</label><input id="pf" placeholder="যেমন: ১২ পিসে ১ পিস ফ্রি" value="${esc(p.free||'')}">
  <label class="f">ক্যাটাগরি</label><select id="pc">${CATS.map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select>
  <label class="f">ছবি</label><input id="pi" type="file" accept="image/*" onchange="pick(this)"><div class="between"><button class="p" onclick="saveP('${id||''}')">সেভ</button>${id?`<button class="g" onclick="delP('${id}')">মুছুন</button>`:''}<button onclick="this.closest('.modal').remove()">বাতিল</button></div></div>`;document.body.append(m);sumP()});
W('pick',inp=>{const f=inp.files[0];if(!f)return;shrink(f,320,d=>{S.img=d;toast('ছবি ঠিক আছে')})});
W('saveP',async id=>{const d={name:$('#pn').value.trim(),price:+$('#pp').value,discount:Math.min(90,+$('#pd').value||0),perCarton:Math.max(0,Math.floor(+$('#pcn').value||0)),free:$('#pf').value.trim(),cat:$('#pc').value,img:S.img},b=$('#pb').value.trim();if(!d.name||!d.price)return toast('নাম ও বিক্রয়মূল্য দিন');
  try{let pid=id;if(id)await updateDoc(doc(db,'products',id),d);else pid=(await addDoc(collection(db,'products'),{...d,inStock:true})).id;
    if(b!=='')await setDoc(doc(db,'costs',pid),{buy:+b});else if(id)await deleteDoc(doc(db,'costs',pid));
    document.querySelector('.modal').remove();toast('সেভ হয়েছে')}catch(e){toast(permErr(e))}});
W('delP',async id=>{if(confirm('প্রোডাক্টটি মুছে ফেলবেন?')){try{await deleteDoc(doc(db,'products',id));await deleteDoc(doc(db,'costs',id));document.querySelector('.modal').remove()}catch(e){toast(permErr(e))}}});
W('renderGrid',renderGrid);W('renderList',renderList);
setTimeout(()=>document.getElementById('splash')?.remove(),3000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
